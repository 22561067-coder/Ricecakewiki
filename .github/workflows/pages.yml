name: Deploy Ricecakewiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}
          CI: 'false'
      - name: Add entry points for direct navigation
        run: |
          for route in shop find make latest storage injeolmi; do
            mkdir -p "build/$route"
            cp build/index.html "build/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
